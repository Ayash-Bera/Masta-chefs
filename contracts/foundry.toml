[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false

# Enable ffi for deployment scripts
ffi = true

# Gas reports
gas_reports = ["*"]

# Remappings for npm dependencies
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "@forge-std/=lib/forge-std/src/",
    "@selfxyz/=node_modules/@selfxyz/"
]

# Test configuration
[profile.default.fuzz]
runs = 1000

# CI configuration
[profile.ci]
fuzz = { runs = 10000 }
invariant = { runs = 1000 }

# Local RPC configuration
[rpc_endpoints]
celo_sepolia = "https://forno.celo-sepolia.celo-testnet.org"
celo_mainnet = "https://forno.celo.org"
sepolia = "https://sepolia.infura.io/v3/..."
mainnet = "https://mainnet.infura.io/v3/..."

# Etherscan configuration for verification (optional)
# [etherscan]
# celo = { key = "${CELOSCAN_API_KEY}", url = "https://api.celoscan.io/api" }
# celo-sepolia = { key = "${CELOSCAN_API_KEY}", url = "https://api-alfajores.celoscan.io/api" }